name: SDS extract map compatibility files

on:
  push:
    paths:
      - '.github/workflows/sds-extract-map-compat.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract SDS 3.13.4 map-related files from SMAPI dataset
        shell: python
        run: |
          import io, os, zipfile, pathlib, json, requests

          class RangeReader(io.RawIOBase):
              def __init__(self, url):
                  self.s=requests.Session(); self.url=url
                  h=self.s.head(url,allow_redirects=True,timeout=60); h.raise_for_status()
                  self.n=int(h.headers['Content-Length']); self.p=0
              def readable(self): return True
              def seekable(self): return True
              def tell(self): return self.p
              def seek(self,o,w=io.SEEK_SET):
                  self.p=o if w==io.SEEK_SET else self.p+o if w==io.SEEK_CUR else self.n+o
                  return self.p
              def read(self,size=-1):
                  if self.p>=self.n:return b''
                  if size==0:return b''
                  e=self.n-1 if size is None or size<0 else min(self.n-1,self.p+size-1)
                  r=self.s.get(self.url,headers={'Range':f'bytes={self.p}-{e}'},allow_redirects=True,timeout=180)
                  if r.status_code!=206: raise RuntimeError(r.status_code)
                  b=r.content; self.p+=len(b); return b

          url='https://smapistorage.blob.core.windows.net/exports/stardew-mod-dataset.zip'
          prefix='downloads/Nexus/15/15100/178657/Seven Deadly Sins 1.6/'
          out=pathlib.Path('sds_map_extract')
          out.mkdir(exist_ok=True)
          selected=[]
          rr=RangeReader(url)
          with zipfile.ZipFile(rr) as z:
              names=[n for n in z.namelist() if n.replace('\\','/').startswith(prefix)]
              for n in names:
                  norm=n.replace('\\','/')
                  rel=norm[len(prefix):]
                  low=rel.lower()
                  ext=pathlib.Path(rel).suffix.lower()
                  keep=False
                  if pathlib.Path(rel).name.lower() in {'content.json','manifest.json','config.json'}:
                      keep=True
                  if ext in {'.tmx','.tbin','.tsx','.json','.xml','.dll'} and any(k in low for k in ['map','patch','location','town','joja','warp','asset','seven','sin']):
                      keep=True
                  if keep and not norm.endswith('/'):
                      data=z.read(n)
                      dest=out/rel
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(data)
                      selected.append({'path':rel,'size':len(data)})
          (out/'_manifest.json').write_text(json.dumps({'source':'Seven Deadly Sins 3.13.4 / Nexus file 178657','count':len(selected),'files':selected},ensure_ascii=False,indent=2),encoding='utf-8')
          print('selected',len(selected),'files')
          for x in selected:
              print(x['path'],x['size'])
      - uses: actions/upload-artifact@v4
        with:
          name: sds-3.13.4-map-compat-files
          path: sds_map_extract
          if-no-files-found: error
