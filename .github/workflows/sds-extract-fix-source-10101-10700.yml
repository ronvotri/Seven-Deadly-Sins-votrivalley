name: SDS extract exact CP fix source

on:
  push:
    paths:
      - '.github/workflows/sds-extract-fix-source-10101-10700.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check json5
      - name: Extract exact source ranges
        shell: python
        run: |
          import io,json,zipfile
          from pathlib import Path
          import requests,json5
          class R(io.RawIOBase):
              def __init__(self,url):
                  self.s=requests.Session(); self.url=url
                  h=self.s.head(url,allow_redirects=True,timeout=60); h.raise_for_status()
                  self.n=int(h.headers['Content-Length']); self.p=0
              def readable(self): return True
              def seekable(self): return True
              def tell(self): return self.p
              def seek(self,o,w=io.SEEK_SET):
                  self.p=o if w==io.SEEK_SET else self.p+o if w==io.SEEK_CUR else self.n+o; return self.p
              def read(self,size=-1):
                  if self.p>=self.n:return b''
                  if size==0:return b''
                  e=self.n-1 if size is None or size<0 else min(self.n-1,self.p+size-1)
                  r=self.s.get(self.url,headers={'Range':f'bytes={self.p}-{e}'},allow_redirects=True,timeout=180)
                  if r.status_code!=206: raise RuntimeError(r.status_code)
                  b=r.content; self.p+=len(b); return b
          r=R('https://smapistorage.blob.core.windows.net/exports/stardew-mod-dataset.zip')
          with zipfile.ZipFile(r) as z:
              names=[n for n in z.namelist() if 'Nexus/15/15100/178657/' in n.replace('\\','/') and n.replace('\\','/').lower().endswith('/i18n/default.json') and '[cp]' in n.lower()]
              raw=z.read(names[0])
          items=list(json5.loads(raw.decode('utf-8-sig'),allow_duplicate_keys=True).items())
          out=[]
          for a,b in [(10101,10200),(10601,10700)]:
              for i in range(a,b+1):
                  k,v=items[i-1]
                  out.append({'index':i,'key':k,'source':v})
          Path('audit').mkdir(exist_ok=True)
          Path('audit/CP_FIX_SOURCE_10101_10200_10601_10700.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit source diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/CP_FIX_SOURCE_10101_10200_10601_10700.json
          git commit -m "Record exact source for CP 10101-10200 and 10601-10700" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
