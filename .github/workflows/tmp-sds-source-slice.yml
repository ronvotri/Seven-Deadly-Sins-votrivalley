name: SDS CP mismatch diagnostics

on:
  push:
    paths:
      - '.github/workflows/tmp-sds-source-slice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install JSON5 parser
        run: python -m pip install --disable-pip-version-check json5
      - name: Export exact token mismatch diagnostics
        shell: python
        run: |
          import io, json, re, zipfile
          from pathlib import Path
          from collections import Counter
          import requests, json5

          class R(io.RawIOBase):
              def __init__(self,url):
                  self.url=url; self.s=requests.Session(); h=self.s.head(url,allow_redirects=True,timeout=60); h.raise_for_status(); self.n=int(h.headers['Content-Length']); self.p=0
              def readable(self): return True
              def seekable(self): return True
              def tell(self): return self.p
              def seek(self,o,w=io.SEEK_SET):
                  if w==io.SEEK_SET:self.p=o
                  elif w==io.SEEK_CUR:self.p+=o
                  elif w==io.SEEK_END:self.p=self.n+o
                  return self.p
              def read(self,size=-1):
                  if self.p>=self.n:return b''
                  if size==0:return b''
                  e=self.n-1 if size is None or size<0 else min(self.n-1,self.p+size-1)
                  r=self.s.get(self.url,headers={'Range':f'bytes={self.p}-{e}'},allow_redirects=True,timeout=180)
                  if r.status_code!=206:raise RuntimeError(r.status_code)
                  b=r.content; self.p+=len(b); return b

          reader=R('https://smapistorage.blob.core.windows.net/exports/stardew-mod-dataset.zip')
          with zipfile.ZipFile(reader) as z:
              c=[n for n in z.namelist() if 'Nexus/15/15100/178657/' in n.replace('\\','/') and n.replace('\\','/').lower().endswith('/i18n/default.json') and '[cp]' in n.lower()]
              if len(c)!=1:raise SystemExit(f'expected one source, got {len(c)}')
              raw=z.read(c[0])
          items=list(json5.loads(raw.decode('utf-8-sig'),allow_duplicate_keys=True).items())
          if len(items)!=24827:raise SystemExit(len(items))
          key_to_index={k:i+1 for i,(k,v) in enumerate(items)}
          source_by_key=dict(items)

          token_re=re.compile(r'\{\{.*?\}\}|\[[^\]]+\]|#?\$q\s+[^#]+#|#?\$r\s+[^#]+#|#\$b#|\$[qrb]|\$\d+|%(?:kid\d+|kids\d+|pet\d*)\b|%|@|\^|\|',re.IGNORECASE)
          shard_re=re.compile(r'^CP_(\d+)_(\d+)\.json$')
          mismatches=[]
          for tp in sorted(Path('translations/cp').glob('CP_*_*.json')):
              if not shard_re.match(tp.name):continue
              data=json.loads(tp.read_text(encoding='utf-8'))
              for key,target in data.items():
                  if key not in source_by_key:continue
                  source=source_by_key[key]
                  st=token_re.findall(source); tt=token_re.findall(target)
                  if st!=tt:
                      mismatches.append({'index':key_to_index[key],'key':key,'source':source,'target':target,'source_tokens':st,'target_tokens':tt,'translation_file':str(tp)})

          mismatches.sort(key=lambda x:x['index'])
          def ranges(nums):
              if not nums:return []
              nums=sorted(nums); out=[]; a=b=nums[0]
              for n in nums[1:]:
                  if n==b+1:b=n
                  else:out.append(f'{a}-{b}' if a!=b else str(a));a=b=n
              out.append(f'{a}-{b}' if a!=b else str(a));return out

          blocks={}
          for x in mismatches:
              b=((x['index']-1)//100)*100+1
              blocks.setdefault(b,[]).append(x)
          outdir=Path('audit/mismatches'); outdir.mkdir(parents=True,exist_ok=True)
          for old in outdir.glob('*.json'):old.unlink()
          block_summary=[]
          for b,arr in sorted(blocks.items()):
              e=b+99
              p=outdir/f'CP_{b}_{e}.json'
              p.write_text(json.dumps(arr,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              block_summary.append({'block':f'{b}-{e}','count':len(arr),'first':arr[0]['index'],'last':arr[-1]['index'],'file':str(p)})
          summary={'mismatch_count':len(mismatches),'ranges':ranges([x['index'] for x in mismatches]),'blocks':block_summary}
          Path('audit/CP_MISMATCH_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/CP_MISMATCH_SUMMARY.json audit/mismatches
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Add exact CP token mismatch diagnostics" && git push; fi
