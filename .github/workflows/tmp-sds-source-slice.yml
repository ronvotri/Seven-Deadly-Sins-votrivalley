name: Temporary SDS source slice

on:
  push:
    paths:
      - '.github/workflows/tmp-sds-source-slice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install JSON5 parser
        run: python -m pip install --disable-pip-version-check json5

      - name: Extract exact source, materialize shards, and prepare next slice
        shell: python
        run: |
          import io
          import json
          import zipfile
          from pathlib import Path
          import requests
          import json5

          class ExplicitRangeReader(io.RawIOBase):
              def __init__(self, url):
                  self.url = url
                  self.session = requests.Session()
                  head = self.session.head(url, allow_redirects=True, timeout=60)
                  head.raise_for_status()
                  self.length = int(head.headers['Content-Length'])
                  self.pos = 0
                  print(f'archive_bytes={self.length}')
              def readable(self): return True
              def seekable(self): return True
              def tell(self): return self.pos
              def seek(self, offset, whence=io.SEEK_SET):
                  if whence == io.SEEK_SET: new = offset
                  elif whence == io.SEEK_CUR: new = self.pos + offset
                  elif whence == io.SEEK_END: new = self.length + offset
                  else: raise ValueError('invalid whence')
                  if new < 0: raise ValueError('negative seek')
                  self.pos = min(new, self.length)
                  return self.pos
              def read(self, size=-1):
                  if self.pos >= self.length: return b''
                  if size is None or size < 0: end = self.length - 1
                  else:
                      if size == 0: return b''
                      end = min(self.length - 1, self.pos + size - 1)
                  requested = f'bytes={self.pos}-{end}'
                  r = self.session.get(self.url, headers={'Range': requested}, allow_redirects=True, timeout=180)
                  if r.status_code != 206:
                      raise RuntimeError(f'Range GET failed: {r.status_code} for {requested}')
                  body = r.content
                  self.pos += len(body)
                  return body

          url = 'https://smapistorage.blob.core.windows.net/exports/stardew-mod-dataset.zip'
          reader = ExplicitRangeReader(url)
          with zipfile.ZipFile(reader) as rz:
              names = rz.namelist()
              candidates = [n for n in names if 'Nexus/15/15100/178657/' in n.replace('\\', '/') and n.replace('\\', '/').lower().endswith('/i18n/default.json') and '[cp]' in n.lower()]
              if len(candidates) != 1:
                  raise SystemExit(f'Expected exactly one CP default.json, found {len(candidates)}')
              raw = rz.read(candidates[0])

          data = json5.loads(raw.decode('utf-8-sig'), allow_duplicate_keys=True)
          items = list(data.items())
          print(f'cp_key_count={len(items)}')
          if len(items) != 24827:
              raise SystemExit(f'Unexpected CP key count: {len(items)}')

          # Materialize recent QA-preserved recovery batches into source-keyed shards.
          for start in range(17997, 18997, 100):
              end = start + 99
              recovery_path = Path(f'recovery/index/CP_{start}_{end}.json')
              if not recovery_path.exists():
                  print(f'skip_missing={recovery_path}')
                  continue
              recovery = json.loads(recovery_path.read_text(encoding='utf-8'))
              if len(recovery) != 100:
                  raise SystemExit(f'Unexpected recovery count in {recovery_path}: {len(recovery)}')
              keyed = {items[i-1][0]: recovery[str(i)] for i in range(start, end + 1)}
              out_path = Path(f'translations/cp/CP_{start}_{end}.json')
              out_path.parent.mkdir(parents=True, exist_ok=True)
              out_path.write_text(json.dumps(keyed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(f'materialized={out_path} keys={len(keyed)}')

          # Prepare next exact-source slice.
          start, end = 18997, 19996
          entries = [{'index': i, 'key': items[i-1][0], 'value': items[i-1][1]} for i in range(start, end + 1)]
          out = {
              'source': 'Seven Deadly Sins 1.6 3.13.4 / Nexus file 178657',
              'cp_key_count': len(items),
              'start_index': start,
              'end_index': end,
              'entries': entries
          }
          Path('sds-source-slice.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')

      - name: Commit materialized key-based shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations/cp
          if git diff --cached --quiet; then
            echo "No key-based changes to commit."
          else
            git commit -m "Materialize CP 17997-18996 key-based translations"
            git push
          fi

      - name: Upload source slice
        uses: actions/upload-artifact@v4
        with:
          name: sds-source-slice-18997-19996
          path: sds-source-slice.json
          retention-days: 1
          if-no-files-found: error
