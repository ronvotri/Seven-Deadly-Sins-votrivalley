name: Temporary SDS source slice

on:
  push:
    paths:
      - '.github/workflows/tmp-sds-source-slice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install JSON5 parser
        run: python -m pip install --disable-pip-version-check json5
      - name: Extract final exact source and materialize latest shards
        shell: python
        run: |
          import io, json, zipfile
          from pathlib import Path
          import requests, json5
          class R(io.RawIOBase):
              def __init__(self,url):
                  self.url=url; self.s=requests.Session(); h=self.s.head(url,allow_redirects=True,timeout=60); h.raise_for_status(); self.n=int(h.headers['Content-Length']); self.p=0
              def readable(self): return True
              def seekable(self): return True
              def tell(self): return self.p
              def seek(self,o,w=io.SEEK_SET):
                  self.p = o if w==io.SEEK_SET else self.p+o if w==io.SEEK_CUR else self.n+o
                  return self.p
              def read(self,size=-1):
                  if self.p>=self.n:return b''
                  if size==0:return b''
                  e=self.n-1 if size is None or size<0 else min(self.n-1,self.p+size-1)
                  r=self.s.get(self.url,headers={'Range':f'bytes={self.p}-{e}'},allow_redirects=True,timeout=180)
                  if r.status_code!=206: raise RuntimeError(r.status_code)
                  b=r.content; self.p+=len(b); return b
          reader=R('https://smapistorage.blob.core.windows.net/exports/stardew-mod-dataset.zip')
          with zipfile.ZipFile(reader) as z:
              c=[n for n in z.namelist() if 'Nexus/15/15100/178657/' in n.replace('\\','/') and n.replace('\\','/').lower().endswith('/i18n/default.json') and '[cp]' in n.lower()]
              if len(c)!=1: raise SystemExit(f'expected one source, got {len(c)}')
              raw=z.read(c[0])
          items=list(json5.loads(raw.decode('utf-8-sig'),allow_duplicate_keys=True).items())
          if len(items)!=24827: raise SystemExit(f'bad key count {len(items)}')
          for start in range(22997,23997,100):
              end=start+99
              rp=Path(f'recovery/index/CP_{start}_{end}.json')
              if not rp.exists(): raise SystemExit(f'missing {rp}')
              r=json.loads(rp.read_text(encoding='utf-8'))
              if len(r)!=100: raise SystemExit(f'bad recovery count {rp}: {len(r)}')
              out={items[i-1][0]:r[str(i)] for i in range(start,end+1)}
              p=Path(f'translations/cp/CP_{start}_{end}.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          start,end=23997,24827
          out={'source':'Seven Deadly Sins 1.6 3.13.4 / Nexus file 178657','cp_key_count':len(items),'start_index':start,'end_index':end,'entries':[{'index':i,'key':items[i-1][0],'value':items[i-1][1]} for i in range(start,end+1)]}
          Path('sds-source-slice.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
      - name: Commit materialized key-based shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations/cp
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Materialize CP 22997-23996 key-based translations" && git push; fi
      - name: Upload final source slice
        uses: actions/upload-artifact@v4
        with:
          name: sds-source-slice-23997-24827
          path: sds-source-slice.json
          retention-days: 1
          if-no-files-found: error
