name: Temporary SDS restore and source

on:
  push:
    paths:
      - '.github/workflows/tmp-sds-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install JSON5 parser
        run: python -m pip install --disable-pip-version-check json5
      - name: Materialize recovery and extract CP 1001-2000
        shell: python
        run: |
          import io, json, re, zipfile
          from pathlib import Path
          import requests, json5
          class R(io.RawIOBase):
              def __init__(self,url):
                  self.url=url; self.s=requests.Session(); h=self.s.head(url,allow_redirects=True,timeout=60); h.raise_for_status(); self.n=int(h.headers['Content-Length']); self.p=0
              def readable(self): return True
              def seekable(self): return True
              def tell(self): return self.p
              def seek(self,o,w=io.SEEK_SET):
                  self.p=o if w==io.SEEK_SET else self.p+o if w==io.SEEK_CUR else self.n+o; return self.p
              def read(self,size=-1):
                  if self.p>=self.n:return b''
                  if size==0:return b''
                  e=self.n-1 if size is None or size<0 else min(self.n-1,self.p+size-1)
                  r=self.s.get(self.url,headers={'Range':f'bytes={self.p}-{e}'},allow_redirects=True,timeout=180)
                  if r.status_code!=206:raise RuntimeError(r.status_code)
                  b=r.content;self.p+=len(b);return b
          reader=R('https://smapistorage.blob.core.windows.net/exports/stardew-mod-dataset.zip')
          with zipfile.ZipFile(reader) as z:
              c=[n for n in z.namelist() if 'Nexus/15/15100/178657/' in n.replace('\\','/') and n.replace('\\','/').lower().endswith('/i18n/default.json') and '[cp]' in n.lower()]
              if len(c)!=1:raise SystemExit(f'expected one source, got {len(c)}')
              raw=z.read(c[0])
          items=list(json5.loads(raw.decode('utf-8-sig'),allow_duplicate_keys=True).items())
          if len(items)!=24827:raise SystemExit(f'bad key count {len(items)}')
          shard_re=re.compile(r'^CP_(\d+)_(\d+)\.json$')
          made=[]
          for rp in sorted(Path('recovery/index').glob('CP_*_*.json')):
              m=shard_re.match(rp.name)
              if not m: continue
              a,b=map(int,m.groups())
              if a<1 or b>len(items) or b<a: continue
              r=json.loads(rp.read_text(encoding='utf-8'))
              if any(str(i) not in r for i in range(a,b+1)): continue
              tp=Path(f'translations/cp/CP_{a}_{b}.json')
              if tp.exists(): continue
              out={items[i-1][0]:r[str(i)] for i in range(a,b+1)}
              tp.parent.mkdir(parents=True,exist_ok=True)
              tp.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              made.append(str(tp))
          start,end=1001,2000
          out={'source':'Seven Deadly Sins 1.6 / 3.13.4 / Nexus 178657','cp_key_count':len(items),'start_index':start,'end_index':end,'entries':[{'index':i,'key':items[i-1][0],'value':items[i-1][1]} for i in range(start,end+1)]}
          Path('sds-cp-source-01001-02000.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('materialized',made)
      - name: Commit materialized shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations/cp
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Materialize restored CP recovery shards" && git push; fi
      - name: Upload exact source slice
        uses: actions/upload-artifact@v4
        with:
          name: sds-cp-source-01001-02000
          path: sds-cp-source-01001-02000.json
          retention-days: 1
          if-no-files-found: error
