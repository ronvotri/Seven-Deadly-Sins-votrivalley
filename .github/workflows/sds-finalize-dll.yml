name: SDS finalize DLL Vietnamese

on:
  push:
    paths:
      - '.github/workflows/sds-finalize-dll.yml'
      - 'recovery/dll/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install parser
        run: python -m pip install --disable-pip-version-check json5 requests

      - name: Rebuild and audit exact DLL localization
        shell: python
        run: |
          import io, json, re, zipfile
          from pathlib import Path
          from datetime import datetime, timezone
          import requests, json5

          class R(io.RawIOBase):
              def __init__(self, url):
                  self.url=url; self.s=requests.Session()
                  h=self.s.head(url,allow_redirects=True,timeout=60); h.raise_for_status()
                  self.n=int(h.headers['Content-Length']); self.p=0
              def readable(self): return True
              def seekable(self): return True
              def tell(self): return self.p
              def seek(self,o,w=io.SEEK_SET):
                  self.p=o if w==io.SEEK_SET else self.p+o if w==io.SEEK_CUR else self.n+o
                  return self.p
              def read(self,size=-1):
                  if self.p>=self.n:return b''
                  if size==0:return b''
                  e=self.n-1 if size is None or size<0 else min(self.n-1,self.p+size-1)
                  r=self.s.get(self.url,headers={'Range':f'bytes={self.p}-{e}'},allow_redirects=True,timeout=180)
                  if r.status_code!=206: raise RuntimeError(r.status_code)
                  b=r.content; self.p+=len(b); return b

          root='downloads/Nexus/15/15100/178657/'
          reader=R('https://smapistorage.blob.core.windows.net/exports/stardew-mod-dataset.zip')
          with zipfile.ZipFile(reader) as z:
              names=[n for n in z.namelist() if root in n.replace('\\','/') and n.replace('\\','/').lower().endswith('/i18n/default.json')]
              candidates=[]
              for n in names:
                  try:
                      obj=json5.loads(z.read(n).decode('utf-8-sig'),allow_duplicate_keys=True)
                      if isinstance(obj,dict): candidates.append((n,len(obj),obj))
                  except Exception:
                      pass
          dll=[(n,c,o) for n,c,o in candidates if c==2419]
          if len(dll)!=1: raise SystemExit(f'expected exactly one 2419-key DLL source, got {[(n,c) for n,c,_ in dll]}')
          source_path,_,source_obj=dll[0]
          source_items=list(source_obj.items())

          shard_re=re.compile(r'^DLL_(\d+)_(\d+)\.json$')
          target={}; duplicate=[]; conflict=[]; malformed=[]
          for p in sorted(Path('recovery/dll').glob('DLL_*_*.json')):
              m=shard_re.match(p.name)
              if not m: continue
              a,b=map(int,m.groups())
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  malformed.append({'file':str(p),'error':str(e)}); continue
              expected=[str(i) for i in range(a,b+1)]
              missing_in_shard=[i for i in expected if i not in d]
              extra=[k for k in d if not k.isdigit() or int(k)<a or int(k)>b]
              if missing_in_shard or extra:
                  malformed.append({'file':str(p),'missing':missing_in_shard[:20],'extra':extra[:20]}); continue
              for i in range(a,b+1):
                  v=d[str(i)]
                  if i in target:
                      duplicate.append(i)
                      if target[i]!=v: conflict.append({'index':i,'file':str(p)})
                  else:
                      target[i]=v

          if malformed: raise SystemExit('malformed DLL shards: '+json.dumps(malformed,ensure_ascii=False))
          if conflict: raise SystemExit('conflicting DLL shards: '+json.dumps(conflict[:20],ensure_ascii=False))

          missing=sorted(set(range(1,2420))-set(target))
          unknown=sorted(i for i in target if i<1 or i>2419)

          token_re=re.compile(
              r'\{\{.*?\}\}'
              r'|\[(?:SDS_[^\]]+|\d+(?:\s+\d+)*)\]'
              r'|#?\$q\s+[^#]+#'
              r'|#?\$r\s+[^#]+#'
              r'|#\$b#'
              r'|\$[A-Za-z]+'
              r'|\$\d+'
              r'|%(?:kid\d+|kids\d+|pet\d*)'
              r'|%'
              r'|@'
              r'|\^'
              r'|\|(?:0?\.\d+|\d+(?:\.\d+)?)\|',
              re.I
          )
          han_re=re.compile(r'[\u3400-\u4DBF\u4E00-\u9FFF]')
          mismatch=[]; han=[]
          for i in sorted(target):
              if not 1<=i<=2419: continue
              source=source_items[i-1][1]
              st=token_re.findall(source); tt=token_re.findall(target[i])
              if st!=tt:
                  mismatch.append({'index':i,'key':source_items[i-1][0],'source_tokens':st,'target_tokens':tt,'source':source,'target':target[i]})
              hs=han_re.findall(target[i])
              if hs:
                  han.append({'index':i,'key':source_items[i-1][0],'chars':' '.join(hs[:30]),'target':target[i]})

          audit={
              'project':'Seven Deadly Sins Vietnamese Localization',
              'source_version':'3.13.4',
              'source_nexus_file_id':178657,
              'dll_source_path':source_path,
              'dll_source_key_count':2419,
              'generated_at_utc':datetime.now(timezone.utc).isoformat(),
              'key_based':{
                  'covered_index_count':len(set(target)&set(range(1,2420))),
                  'missing_index_count':len(missing),
                  'duplicate_index_count':len(duplicate),
                  'conflicting_duplicate_count':len(conflict),
                  'unknown_index_count':len(unknown),
                  'technical_token_mismatch_count':len(mismatch),
                  'han_hit_count':len(han)
              },
              'details':{
                  'missing_indices':missing,
                  'duplicate_indices':sorted(set(duplicate)),
                  'unknown_indices':unknown,
                  'technical_token_mismatches':mismatch,
                  'han_hits':han
              }
          }
          Path('audit').mkdir(exist_ok=True)
          Path('audit/DLL_AUDIT.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit['key_based'],ensure_ascii=False,indent=2))

          if missing or conflict or unknown or mismatch or han:
              raise SystemExit('DLL audit is not clean')

          canonical={source_items[i-1][0]:target[i] for i in range(1,2420)}
          Path('translations/dll').mkdir(parents=True,exist_ok=True)
          Path('translations/dll/vi.json').write_text(json.dumps(canonical,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

      - name: Commit canonical DLL and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/DLL_AUDIT.json translations/dll/vi.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Finalize canonical DLL Vietnamese and clean audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
