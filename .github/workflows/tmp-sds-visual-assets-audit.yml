name: SDS visual asset audit

on:
  push:
    paths:
      - '.github/workflows/tmp-sds-visual-assets-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Inspect SDS 3.13.4 visual assets from SMAPI dataset
        shell: python
        run: |
          import io, zipfile, pathlib, json, requests, struct, hashlib, re

          class RangeReader(io.RawIOBase):
              def __init__(self, url):
                  self.s=requests.Session(); self.url=url
                  h=self.s.head(url,allow_redirects=True,timeout=60); h.raise_for_status()
                  self.n=int(h.headers['Content-Length']); self.p=0
              def readable(self): return True
              def seekable(self): return True
              def tell(self): return self.p
              def seek(self,o,w=io.SEEK_SET):
                  self.p=o if w==io.SEEK_SET else self.p+o if w==io.SEEK_CUR else self.n+o
                  return self.p
              def read(self,size=-1):
                  if self.p>=self.n:return b''
                  if size==0:return b''
                  e=self.n-1 if size is None or size<0 else min(self.n-1,self.p+size-1)
                  r=self.s.get(self.url,headers={'Range':f'bytes={self.p}-{e}'},allow_redirects=True,timeout=180)
                  if r.status_code!=206: raise RuntimeError(r.status_code)
                  b=r.content; self.p+=len(b); return b

          def png_size(data):
              if len(data)>=24 and data[:8]==b'\x89PNG\r\n\x1a\n':
                  return struct.unpack('>II',data[16:24])
              return None

          url='https://smapistorage.blob.core.windows.net/exports/stardew-mod-dataset.zip'
          prefix='downloads/Nexus/15/15100/178657/Seven Deadly Sins 1.6/'
          out=pathlib.Path('sds_visual_audit'); out.mkdir(exist_ok=True)
          focus=('raymond','maria','edward','portrait','afdian','copyright','notice','disclaimer','splash','title','start','menu','logo','intro')
          image_rows=[]; text_hits=[]; saved=[]; all_paths=[]
          rr=RangeReader(url)
          with zipfile.ZipFile(rr) as z:
              names=[n for n in z.namelist() if n.replace('\\','/').startswith(prefix) and not n.endswith('/')]
              for n in names:
                  rel=n.replace('\\','/')[len(prefix):]
                  all_paths.append(rel)
                  low=rel.lower(); ext=pathlib.Path(rel).suffix.lower()
                  if ext=='.png':
                      data=z.read(n)
                      wh=png_size(data)
                      row={'path':rel,'size':len(data),'dimensions':wh,'sha256':hashlib.sha256(data).hexdigest()}
                      image_rows.append(row)
                      large=bool(wh and (wh[0]>=700 or wh[1]>=400))
                      if any(k in low for k in focus) or large:
                          dest=out/'images'/rel
                          dest.parent.mkdir(parents=True,exist_ok=True)
                          dest.write_bytes(data); saved.append(rel)
                  elif ext in {'.json','.json5','.txt','.xml','.tmx','.yaml','.yml'}:
                      try:
                          data=z.read(n)
                          txt=data.decode('utf-8-sig',errors='replace')
                      except Exception:
                          continue
                      lower_txt=txt.lower()
                      keys=[k for k in focus if k in lower_txt or k in low]
                      if keys:
                          text_hits.append({'path':rel,'keywords':keys})
                          dest=out/'text'/rel
                          dest.parent.mkdir(parents=True,exist_ok=True)
                          dest.write_bytes(data)
          (out/'image_manifest.json').write_text(json.dumps(image_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'text_hits.json').write_text(json.dumps(text_hits,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'all_paths.txt').write_text('\n'.join(all_paths),encoding='utf-8')
          (out/'summary.json').write_text(json.dumps({'image_count':len(image_rows),'saved_images':saved,'text_hits':text_hits},ensure_ascii=False,indent=2),encoding='utf-8')
          print('images',len(image_rows),'saved',len(saved),'text hits',len(text_hits))
          print('saved images:')
          for x in saved: print(x)
          print('text hits:')
          for x in text_hits: print(x)
      - uses: actions/upload-artifact@v4
        with:
          name: sds-3.13.4-visual-assets-audit
          path: sds_visual_audit
          if-no-files-found: error
